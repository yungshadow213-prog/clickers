name: Validate reading website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate shareable story pages
        run: node scripts/generate-story-pages.mjs
      - name: Validate markup, reader JavaScript, and manuscript data
        run: node scripts/validate-site.mjs
      - name: Test private Worker API security rules
        run: node --test tests/worker.test.mjs
