name: Deploy Clickers Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Add the CLOUDFLARE_API_TOKEN repository secret." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Add the CLOUDFLARE_ACCOUNT_ID repository secret." && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Configure optional Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLICKERS_SUPABASE_SECRET_KEY: ${{ secrets.CLICKERS_SUPABASE_SECRET_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_WEBHOOK_SECRET: ${{ secrets.PAYSTACK_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$CLICKERS_SUPABASE_SECRET_KEY" ]; then printf '%s' "$CLICKERS_SUPABASE_SECRET_KEY" | wrangler secret put SUPABASE_SECRET_KEY; fi
          if [ -n "$PAYSTACK_SECRET_KEY" ]; then printf '%s' "$PAYSTACK_SECRET_KEY" | wrangler secret put PAYSTACK_SECRET_KEY; fi
          if [ -n "$PAYSTACK_WEBHOOK_SECRET" ]; then printf '%s' "$PAYSTACK_WEBHOOK_SECRET" | wrangler secret put PAYSTACK_WEBHOOK_SECRET; fi
      - name: Deploy Worker with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
